<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Content Intelligence — Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script>
    // Applied before first paint so a dark-theme reload never flashes white.
    try {
      const saved = localStorage.getItem("yci.theme");
      document.documentElement.dataset.bsTheme = saved
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) { document.documentElement.dataset.bsTheme = "light"; }
  </script>
</head>
<body class="auth-page">
  <div id="toast-box" class="toast-box"></div>

  <div class="container" style="max-width:460px;">
    <div class="text-center mb-4">
      <div class="brand brand-lg justify-content-center mb-2">
        <span class="brand-mark">▶</span>
        <span class="brand-title">YouTube Content Intelligence</span>
      </div>
      <p class="text-muted mb-0">Find out what to make next, from your own audience and your competitors.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" id="tab-login" type="button">Sign in</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-signup" type="button">Create account</button>
          </li>
        </ul>

        <form id="auth-form" novalidate>
          <div class="mb-3 hidden" id="name-group">
            <label class="form-label" for="name">Name</label>
            <input id="name" class="form-control" autocomplete="name" placeholder="Your name">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required>
            <div class="form-text hidden" id="password-hint">At least 8 characters.</div>
          </div>

          <button id="submit" class="btn btn-brand w-100" type="submit">Sign in</button>
        </form>

        <div id="msg" class="mt-3"></div>
      </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
      Bring your own YouTube and model API keys once you're in — Settings → API access.
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    let mode = "login";

    function setMode(next) {
      mode = next;
      const signup = mode === "signup";
      el("tab-login").classList.toggle("active", !signup);
      el("tab-signup").classList.toggle("active", signup);
      el("name-group").classList.toggle("hidden", !signup);
      el("password-hint").classList.toggle("hidden", !signup);
      el("submit").textContent = signup ? "Create account" : "Sign in";
      el("password").setAttribute("autocomplete", signup ? "new-password" : "current-password");
      el("msg").innerHTML = "";
    }
    el("tab-login").onclick = () => setMode("login");
    el("tab-signup").onclick = () => setMode("signup");

    el("auth-form").onsubmit = async (e) => {
      e.preventDefault();

      const email = el("email").value.trim();
      const password = el("password").value;
      if (!email || !password) {
        el("msg").innerHTML = '<div class="alert alert-danger">Enter your email and password.</div>';
        return;
      }

      const btn = el("submit");
      btn.disabled = true;
      const label = btn.textContent;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Please wait…';
      try {
        const path = mode === "signup" ? "/api/auth/signup" : "/api/auth/login";
        const body = mode === "signup"
          ? { name: el("name").value.trim(), email, password }
          : { email, password };
        const res = await API.post(path, body);
        API.setToken(res.token);
        location.href = "app.html";
      } catch (err) {
        el("msg").innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>';
        btn.disabled = false;
        btn.textContent = label;
      }
    };

    // Already signed in? Go straight through.
    if (API.token()) location.href = "app.html";
  </script>
</body>
</html>
