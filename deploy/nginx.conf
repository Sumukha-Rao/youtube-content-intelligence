server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- the API lives on this same origin ----
    #
    # The page calls /api/... with no host in front of it, so there is no backend
    # URL written into the frontend at all: whatever origin the app is opened on
    # is the origin its API calls go to. That also means no CORS preflight and no
    # "works on my machine, not on the server" mismatch.
    #
    # The upstream goes through a variable on purpose. With a literal host in
    # proxy_pass, nginx resolves it once at startup and refuses to boot if the
    # backend container is not up yet; with a variable plus Docker's embedded DNS
    # (127.0.0.11) it is resolved per request, so the frontend survives a backend
    # restart on its own.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $yci_backend "backend:8080";

        proxy_pass http://$yci_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Testing a slow local model from Settings can legitimately take a minute.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Always revalidate before reusing a cached asset.
    #
    # Without this the browser is free to keep serving an old js/api.js from its
    # own cache while the server has a new one, and the page breaks in a way that
    # looks like a code bug ("API.setBase is not a function") rather than a stale
    # file. ETags make the revalidation a cheap 304, so this costs almost nothing.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Long-lived, content-addressed assets could be cached hard here if any get
    # added later (e.g. /assets/app.<hash>.js).
}
